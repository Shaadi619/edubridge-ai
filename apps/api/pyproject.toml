[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edubridge-api"
version = "0.1.0"
description = "EduBridge AI backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "openai>=1.68,<4",
  "pyjwt[crypto]>=2.10,<3",
  "httpx>=0.28,<1",
  "pypdf>=5.7,<6",
  "python-pptx>=1.0,<2",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
